name: Bump version

# Every merge to main that changes extension code (not docs, tests or workflows) bumps the patch version in manifest.json, so unpacked installs
# (chrome://extensions) see a newer version and notify their users, and publishes a release with the install zip.
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'icons/**'
      - manifest.json

permissions:
  contents: write

jobs:
  bump:
    # The bump commit is pushed with GITHUB_TOKEN, which doesn't trigger workflows, and the actor check
    # below is a second guard, so this can't loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump patch version
        run: |
          current=$(jq -r .version manifest.json)
          next=$(echo "$current" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          jq --arg v "$next" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          echo "Bumped $current -> $next"
          echo "version=$next" >> "$GITHUB_ENV"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version [skip ci]"
          git push
      - name: Publish release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r chat-reminders.zip manifest.json ./*.js ./*.css ./*.html icons LICENSE
          gh release create "v$version" chat-reminders.zip --target "$(git rev-parse HEAD)" \
            --title "v$version" --generate-notes
