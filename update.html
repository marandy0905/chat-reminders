<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="page_title">Update Chat Reminders</title>
  <link rel="stylesheet" href="update.css">
</head>
<body>
  <main>
    <h1 data-i18n="page_title">Update Chat Reminders</h1>
    <p id="versions"></p>
    <ol>
      <li id="step1"><b data-i18n="step1_title">Allow updating</b> <span data-i18n="step1_desc">Pick the folder this extension was loaded from. You only need to do this once.</span>
        <button id="pick" type="button" data-i18n="btn_pick">Choose folder</button></li>
      <li id="step2"><b data-i18n="step2_title">Update</b> <span data-i18n="step2_desc">Downloads the latest version into that folder and reloads the extension.</span>
        <button id="go" type="button" class="primary" data-i18n="btn_go" disabled>Update now</button></li>
    </ol>
    <p id="status" role="status"></p>
    <p class="hint"><span data-i18n="manual_pre">Prefer to do it by hand?</span> <a id="manual" data-i18n="manual_link" href="https://github.com/marandy0905/chat-reminders/releases/latest" target="_blank" rel="noopener">Download the zip</a> <span data-i18n="manual_post">and unzip it over your folder.</span></p>
  </main>
  <script src="time.js"></script>
  <script src="fflate.js"></script>
  <script src="update.js"></script>
</body>
</html>
